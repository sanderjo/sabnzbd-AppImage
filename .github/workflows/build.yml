name: Build AppImage
run-name: Build SABnzbd ${{ inputs.sabnzbd_version || 'AppImage' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sabnzbd_version:
        description: "SABnzbd release tag, e.g. 5.2.0Beta2 (empty = default from build.sh)"
        required: false
        default: ""
      release:
        description: "Publish the AppImage as a GitHub Release (tag = SABnzbd version)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only used by the release step
    env:
      SABNZBD_VERSION: ${{ inputs.sabnzbd_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache downloads
        uses: actions/cache@v6
        with:
          path: downloads
          key: downloads-${{ hashFiles('build.sh') }}-${{ inputs.sabnzbd_version }}
          restore-keys: downloads-

      - name: Build
        run: |
          # An empty SABNZBD_VERSION must not override the default in build.sh
          [ -n "$SABNZBD_VERSION" ] || unset SABNZBD_VERSION
          ./build.sh

      - name: Smoke test
        run: |
          appimage=$(ls SABnzbd-*-x86_64.AppImage)
          cfg="$RUNNER_TEMP/sabnzbd"
          mkdir -p "$cfg"
          # Runners have no FUSE, so let the AppImage extract itself
          "./$appimage" --appimage-extract-and-run -f "$cfg/sabnzbd.ini" -s 127.0.0.1:8080 -b 0 -l 2 &
          for i in $(seq 60); do
            curl -sf "http://127.0.0.1:8080/api?mode=version&output=json" && break
            sleep 1
          done
          echo
          log="$cfg/logs/sabnzbd.log"
          for want in "linked to OpenSSL: True" "par2 binary... found" "UNRAR binary... found" "7za binary... found"; do
            grep -F "$want" "$log" || { echo "::error::Missing in log: $want"; cat "$log"; exit 1; }
          done
          kill %1

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          # Upload the AppImage itself, not a zip; the download is named after the file
          archive: false
          path: SABnzbd-*-x86_64.AppImage
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          appimage=$(ls SABnzbd-*-x86_64.AppImage)
          version=${appimage#SABnzbd-}
          version=${version%-x86_64.AppImage}
          flags=()
          case "$version" in *[Aa]lpha*|*[Bb]eta*|*RC*) flags+=(--prerelease) ;; esac
          v() { grep -m1 "^$1=" build.sh | cut -d'"' -f2; }
          cat > notes.md <<EOF
          Self-contained SABnzbd ${version} for x86_64 Linux (glibc 2.17 or newer).

          Includes Python $(v PYTHON_VERSION), unrar $(v UNRAR_VERSION | sed 's/./&./'), \
          par2cmdline-turbo $(v PAR2_VERSION) and 7-Zip $(v SEVENZIP_TAG).

          \`\`\`sh
          chmod +x ${appimage}
          ./${appimage}
          \`\`\`

          SABnzbd release notes: https://github.com/sabnzbd/sabnzbd/releases/tag/${version}
          EOF
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" "$appimage" --clobber
          else
            gh release create "$version" "$appimage" --target "$GITHUB_SHA" \
              --title "SABnzbd $version" --notes-file notes.md "${flags[@]}"
          fi
